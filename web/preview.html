<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nomad Preview</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --line: #d9dee7;
        --text: #172033;
        --muted: #657083;
        --primary: #06f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      }

      .preview-shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100vh;
      }

      .preview-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex-wrap: wrap;
      }

      .preview-title {
        display: grid;
        gap: 2px;
        margin-right: auto;
      }

      .preview-title strong {
        font-size: 15px;
        line-height: 1.3;
      }

      .preview-title span,
      label {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .preset-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      button,
      input,
      select {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
        letter-spacing: 0;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      button.active {
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 700;
      }

      input,
      select {
        width: 86px;
        padding: 0 8px;
      }

      .field {
        display: grid;
        gap: 3px;
      }

      .preview-stage {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 24px;
      }

      .device-frame {
        width: var(--device-width, 390px);
        height: var(--device-height, 844px);
        margin: 0 auto;
        border: 1px solid #c8d0dc;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(23, 32, 51, 0.14);
        transform: scale(var(--device-scale, 1));
        transform-origin: top center;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      @media (max-width: 720px) {
        .preview-toolbar {
          align-items: stretch;
        }

        .preview-title {
          width: 100%;
        }

        .preset-group,
        .field {
          flex: 1 1 auto;
        }

        button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-toolbar">
        <div class="preview-title">
          <strong>Nomad Life Preview</strong>
          <span id="size-label">390 x 844 · 100%</span>
        </div>

        <div class="preset-group" aria-label="해상도 프리셋">
          <button type="button" data-preset="390,844">iPhone</button>
          <button type="button" data-preset="430,932">Large Mobile</button>
          <button type="button" data-preset="768,1024">Tablet</button>
          <button type="button" data-preset="1024,768">Tablet Wide</button>
          <button type="button" data-preset="1440,900">Desktop</button>
        </div>

        <label class="field">
          Width
          <input id="width-input" type="number" min="280" max="1920" step="1" value="390" />
        </label>
        <label class="field">
          Height
          <input id="height-input" type="number" min="320" max="1400" step="1" value="844" />
        </label>
        <label class="field">
          Scale
          <select id="scale-input">
            <option value="1">100%</option>
            <option value="0.9">90%</option>
            <option value="0.8">80%</option>
            <option value="0.7">70%</option>
            <option value="0.6">60%</option>
            <option value="0.5">50%</option>
          </select>
        </label>
        <button id="rotate-button" type="button">Rotate</button>
        <button id="reload-button" type="button">Reload</button>
      </header>

      <section class="preview-stage" aria-label="앱 프리뷰">
        <div id="device-frame" class="device-frame">
          <iframe id="app-frame" src="/web/#main" title="Nomad Life app preview"></iframe>
        </div>
      </section>
    </main>

    <script>
      const frame = document.querySelector("#device-frame");
      const iframe = document.querySelector("#app-frame");
      const widthInput = document.querySelector("#width-input");
      const heightInput = document.querySelector("#height-input");
      const scaleInput = document.querySelector("#scale-input");
      const sizeLabel = document.querySelector("#size-label");
      const presetButtons = [...document.querySelectorAll("[data-preset]")];

      function applySize(width = widthInput.value, height = heightInput.value, scale = scaleInput.value) {
        const normalizedWidth = Math.max(280, Math.min(1920, Number(width) || 390));
        const normalizedHeight = Math.max(320, Math.min(1400, Number(height) || 844));
        const normalizedScale = Number(scale) || 1;
        widthInput.value = normalizedWidth;
        heightInput.value = normalizedHeight;
        frame.style.setProperty("--device-width", `${normalizedWidth}px`);
        frame.style.setProperty("--device-height", `${normalizedHeight}px`);
        frame.style.setProperty("--device-scale", String(normalizedScale));
        sizeLabel.textContent = `${normalizedWidth} x ${normalizedHeight} · ${Math.round(normalizedScale * 100)}%`;
        presetButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.preset === `${normalizedWidth},${normalizedHeight}`);
        });
      }

      presetButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const [width, height] = button.dataset.preset.split(",");
          applySize(width, height, scaleInput.value);
        });
      });

      widthInput.addEventListener("input", () => applySize());
      heightInput.addEventListener("input", () => applySize());
      scaleInput.addEventListener("change", () => applySize());
      document.querySelector("#rotate-button").addEventListener("click", () => {
        applySize(heightInput.value, widthInput.value, scaleInput.value);
      });
      document.querySelector("#reload-button").addEventListener("click", () => {
        iframe.contentWindow.location.reload();
      });

      applySize();
    </script>
  </body>
</html>
