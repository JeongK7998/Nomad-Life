<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <meta name="theme-color" content="#171719" />
    <title>Workout Quick Input</title>
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://127.0.0.1:4174/web/workout-quick.html");
      }
    </script>
    <link rel="manifest" href="/web/workout-quick.webmanifest?v=20260519-stay-ready" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web/icons/workout-icon-192.png?v=20260508-category-entry" />
    <link rel="apple-touch-icon" href="/web/icons/workout-icon-180.png?v=20260508-category-entry" />
    <link rel="stylesheet" href="design-tokens.css?v=20260507-inline-labels" />
    <link rel="stylesheet" href="workout-quick.css?v=20260522-mobile-dialog-fixes" />
  </head>
  <body>
    <section id="auth-panel" class="auth-panel quick-auth-panel" hidden aria-label="Nomad Life 로그인">
      <div>
        <p class="eyebrow">Nomad Cloud</p>
        <strong id="auth-user"></strong>
        <span>로그인하면 이 기기/앱의 세션이 유지되고, 저장한 운동은 분석과 Dashboard 반영 대상으로 이어집니다.</span>
      </div>
      <form id="auth-form" class="auth-form">
        <input id="auth-email" name="email" type="email" autocomplete="email" placeholder="이메일" aria-label="이메일" required />
        <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" minlength="6" required />
        <button id="auth-sign-in" type="submit">로그인</button>
        <button id="auth-sign-up" class="ghost-button" type="submit">계정 만들기</button>
      </form>
      <button id="auth-sign-out" class="ghost-button" type="button" hidden>로그아웃</button>
      <p id="auth-status" role="status">Save는 즉시 저장되고, Hermes는 이후 분석과 Dashboard 반영을 수행합니다.</p>
    </section>
    <main class="quick-shell">
      <header class="quick-header">
        <div>
          <p class="eyebrow">Nomad Health</p>
          <h1>Workout Quick</h1>
        </div>
        <a href="/web/#health" aria-label="Health Dashboard로 이동">↗</a>
      </header>

      <section class="quick-card">
        <section id="workout-category-panel" class="workout-category-panel" aria-label="활동 카테고리 선택">
          <div class="category-heading">
            <p class="eyebrow">Nomad Quick</p>
            <h2>활동 선택</h2>
          </div>
          <div class="category-grid" role="group" aria-label="활동 카테고리">
            <button type="button" data-activity-category="work" aria-pressed="false">일</button>
            <button type="button" data-activity-category="health" aria-pressed="false">운동</button>
            <button type="button" data-activity-category="food" aria-pressed="false">식사</button>
            <button type="button" data-activity-category="english" aria-pressed="false">공부</button>
            <button type="button" data-activity-category="creator" aria-pressed="false">창작</button>
            <button type="button" data-activity-category="travel" aria-pressed="false">여행</button>
            <button type="button" data-activity-category="social" aria-pressed="false">소셜</button>
            <button type="button" data-activity-category="rest" aria-pressed="false">휴식</button>
          </div>
        </section>

        <div id="workout-detail-panel" class="workout-detail-panel" hidden>
          <div class="detail-heading">
            <button id="back-to-category" class="ghost-button" type="button">← 활동</button>
            <strong id="selected-category-label">운동</strong>
          </div>

        <div class="quick-meta">
          <button id="time-button" class="dark-button time-button" type="button">
            <span>현재 시간</span>
            <strong id="time-button-value">현재 시간 적용됨</strong>
          </button>
          <p id="time-status">현재 시간 적용됨</p>
        </div>
        <div id="time-panel" class="time-panel" hidden>
          <label>
            <span>날짜</span>
            <input id="start-date" type="date" />
          </label>
          <label>
            <span>시간</span>
            <input id="start-time" type="time" />
          </label>
          <button id="apply-time" type="button">완료</button>
        </div>

        <form id="quick-form" class="quick-form">
          <div class="two-grid">
            <label class="muscle-field">
              <span>부위</span>
              <select id="muscle-select">
                <option value="chest">가슴</option>
                <option value="back">등</option>
                <option value="legs">하체</option>
                <option value="shoulders">어깨</option>
                <option value="arms">팔</option>
                <option value="core">코어</option>
                <option value="full_body">전신</option>
                <option value="other">기타</option>
              </select>
            </label>
            <label class="exercise-field">
              <span>운동</span>
              <select id="exercise-select"></select>
            </label>
          </div>

          <div class="meta-actions" aria-label="운동 빠른 도구">
            <button id="favorite-button" class="icon-button" type="button" aria-label="즐겨찾기" title="즐겨찾기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.35-9.2-8.5C.9 7.9 3.1 4.5 6.8 4.5c2.1 0 3.4 1.1 5.2 3 1.8-1.9 3.1-3 5.2-3 3.7 0 5.9 3.4 4 7C19 15.65 12 20 12 20Z"/></svg>
            </button>
            <button id="manage-button" class="icon-button" type="button" aria-label="운동 추가" title="운동 추가">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
            <button id="info-button" class="icon-button" type="button" aria-label="운동 정보" title="운동 정보">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10v7"/><path d="M12 7h.01"/><circle cx="12" cy="12" r="9"/></svg>
            </button>
            <button id="reset-button" class="icon-button utility-action" type="button" aria-label="입력값 리셋" title="입력값 리셋">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7v5h5"/><path d="M5.5 12A7 7 0 1 0 7 6.8L4 10"/></svg>
            </button>
            <button id="recent-button" class="icon-button" type="button" aria-label="최근 운동 기록" title="최근 운동 기록">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2"/><path d="M3.5 12A8.5 8.5 0 1 0 6 6"/><path d="M3 5v5h5"/></svg>
            </button>
          </div>

          <p id="latest-guide" hidden>이전 운동 기록이 있으면 여기에 표시됩니다.</p>

          <div class="number-row">
            <label>
              <span>무게</span>
              <input id="weight-input" type="number" inputmode="decimal" min="0" step="0.5" value="60" />
            </label>
            <label>
              <span>반복</span>
              <input id="reps-input" type="number" inputmode="numeric" min="1" step="1" value="10" />
            </label>
            <input id="rpe-input" type="hidden" />
            <button id="add-set" class="primary-button" type="button">세트 추가</button>
          </div>
          <p id="quick-status" role="status"></p>

          <div id="draft-list" class="draft-list"></div>

          <label class="note-field">
            <span>메모</span>
            <textarea id="note-input" rows="3" placeholder="기구 상태, 통증, 컨디션, 자세 메모"></textarea>
          </label>

          <button id="save-workout" class="dark-button save-button" type="submit">운동 종료 및 저장</button>
        </form>
        </div>
      </section>
    </main>

    <dialog id="exercise-dialog" class="quick-dialog">
      <form method="dialog">
        <header>
          <div>
            <p class="eyebrow">Exercise</p>
            <h2 id="dialog-title">Exercise</h2>
          </div>
          <button class="ghost-button" type="submit">닫기</button>
        </header>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <script src="workout-quick.js?v=20260522-mobile-dialog-fixes" type="module"></script>
  </body>
</html>
